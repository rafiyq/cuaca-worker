name: typescript

on:
  push:
    branches: [main]
    paths: ['typescript/**', '.github/workflows/typescript.yml']
  pull_request:
    paths: ['typescript/**', '.github/workflows/typescript.yml']
  workflow_dispatch:

# Serialize runs per ref: production deploys never overlap; PR test
# runs of the same PR queue instead of racing.
concurrency:
  group: cuaca-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    # Production deploys: main only, after tests pass. (Secrets can't be
    # referenced in job-level if-expressions, so presence is checked in
    # the guard step below -- job stays green until they're configured.)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Guard — skip until Cloudflare secrets are configured
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping deploy. See typescript workflow README notes to enable."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'
      - uses: cloudflare/wrangler-action@v3
        if: steps.guard.outputs.skip == 'false'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: typescript