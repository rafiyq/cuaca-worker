name: typescript

# CI only: run the test suite on pushes to main and PRs that touch
# the TypeScript implementation. Releases/deployments live in
# .github/workflows/deploy.yml (triggered by v* tags).

on:
  push:
    branches: [main]
    paths: ['typescript/**', '.github/workflows/typescript.yml']
  pull_request:
    paths: ['typescript/**', '.github/workflows/typescript.yml']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test