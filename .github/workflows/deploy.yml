name: deploy

# Release deployment: push a version tag (v*) to deploy to production.
# Runs the full test suite on the tagged commit first, then deploys the
# TypeScript worker with the wrangler version pinned in the lockfile
# (the same one the test job validated), stamping the Worker Version
# with the git tag. Manual runs (workflow_dispatch) skip the version stamp.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set — refusing to deploy a release."
            exit 1
          fi
      - run: npm ci
      - name: Deploy Worker (stamp Worker Version with git tag)
        run: |
          EXTRA=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            EXTRA="--tag $GITHUB_REF_NAME"
          fi
          npx wrangler deploy $EXTRA