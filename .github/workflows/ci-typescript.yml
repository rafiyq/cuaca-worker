name: typescript

on:
  push:
    branches: [main]
    paths: ['typescript/**', '.github/workflows/ci-typescript.yml']
  pull_request:
    paths: ['typescript/**', '.github/workflows/ci-typescript.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test